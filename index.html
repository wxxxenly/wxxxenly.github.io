<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>wxxxenly</title>
    <link rel="stylesheet" href="static/css/base.css">
    <link rel="stylesheet" href="static/css/hero.css">
    <link rel="stylesheet" href="static/css/about.css">
    <link rel="stylesheet" href="static/css/projects.css">
    <link rel="stylesheet" href="static/css/contacts.css">
    <link rel="stylesheet" href="static/css/navbar.css">
    <link rel="stylesheet" href="static/css/terminal.css">
</head>
<body>

    <!-- Прогресс-бар скролла -->
    <div class="scroll-progress-bar" id="scrollProgress"></div>

    <!-- Навигационное меню -->
    <nav class="navbar" id="navbar">
        <div class="navbar-container">
            <a href="#hero" class="navbar-logo" id="navLogo">Portfolio</a>
            <ul class="navbar-menu">
                <li><a href="#about" class="navbar-link">Обо мне</a></li>
                <li><a href="#projects" class="navbar-link">Проекты</a></li>
                <li><a href="#contacts" class="navbar-link">Контакты</a></li>
            </ul>
            <button class="navbar-toggle" id="navbarToggle" aria-label="Открыть меню">
                <span></span><span></span><span></span>
            </button>
        </div>
    </nav>

    <!-- Контейнер для динамического контента -->
    <div id="app"></div>

    <!-- Терминал-пасхалка -->
    <div class="terminal-overlay" id="terminalOverlay">
        <div class="terminal-window">
            <div class="terminal-header">
                <span class="terminal-title">guest@portfolio: ~</span>
                <button class="terminal-close" id="terminalClose">×</button>
            </div>
            <div class="terminal-body" id="terminalBody">
                <div class="terminal-output" id="terminalOutput"></div>
                <div class="terminal-input-line">
                    <span class="terminal-prompt">guest@portfolio:~$</span>
                    <input type="text" class="terminal-input" id="terminalInput" autofocus autocomplete="off">
                </div>
            </div>
        </div>
    </div>

    <!-- Скрипты -->
    <script src="static/js/github-loader.js"></script>
    <script src="static/js/scroll-animations.js"></script>
    <script src="static/js/carousel.js"></script>
    <script src="static/js/navbar.js"></script>
    <script src="static/js/terminal.js"></script>
    <script src="static/js/main.js"></script>
</body>
</html>
